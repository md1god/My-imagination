name: Genesis Cloud Life

on:
  schedule:
    - cron: '0 * * * *'    # يعمل تلقائياً كل ساعة
  workflow_dispatch:       # يتيح التشغيل اليدوي من زر في غيت هب

jobs:
  run-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # السماح للروبوت بتعديل وحفظ الذاكرة في المستودع

    steps:
      - name: 📂 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 🦀 تثبيت لغة Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ⚙️ تشغيل النواة السحابية
        run: cargo run --release
        env:
          CYCLES: 3

      - name: 📝 تحديث الذاكرة تلقائياً في المستودع
        run: |
          git config --global user.name "Genesis Cloud Bot"
          git config --global user.email "bot@genesis.local"
          git add memory.json
          git diff --staged --quiet || git commit -m "🧠 تطور الذاكرة التلقائي: دورة سحابية جديدة"
          git push
