name: Genesis Infinite Evolution

on:
  schedule:
    - cron: '0 * * * *'    # يعمل كل ساعة تلقائياً
  workflow_dispatch:       # للتشغيل اليدوي الفوري

jobs:
  infinite-life:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # منح الصلاحية للكيان لتعديل وإنشاء ملفات في مستودعه

    steps:
      - name: 📂 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 🦀 تثبيت لغة Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ⚙️ تشغيل الكيان للتطور الحر
        run: cargo run --release
        env:
          CYCLES: 3        # عدد الدورات في كل مرة يستيقظ فيها

      - name: 📝 حفظ كل ما أنشأه الكيان في المستودع
        run: |
          git config --global user.name "Genesis Autonomous Agent"
          git config --global user.email "agent@genesis.local"
          git add .
          git diff --staged --quiet || git commit -m "🧠 تطور حر: الكيان أنشأ ملفات جديدة ووسع ذاكرته (جيل $(jq .generation memory.json))"
          git push
