name: Genesis Infinite Evolution

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  infinite-life:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 🦀 تثبيت لغة Rust
        uses: dtolnay/rust-toolchain@stable

      - name: ⚙️ تشغيل كريزي للتطور الحر
        run: cargo run --release
        env:
          CYCLES: 3
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 📝 حفظ كل ما أنشأه كريزي في المستودع
        run: |
          git config --global user.name "Genesis Autonomous Agent"
          git config --global user.email "agent@genesis.local"
          git add .
          git diff --staged --quiet || git commit -m "🧠 تطور حر: كريزي أنشأ ملفات جديدة ووسع ذاكرته (جيل $(jq .generation memory.json))"
          git push
